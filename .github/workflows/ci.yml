name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - name: Protocol + compression tests
        run: npm test
      - name: Type check
        run: bun run typecheck
      - name: Lint (advisory)
        run: bun run lint
        continue-on-error: true
      - name: Build
        run: bun run build
